upstream auth         { server auth:4000; }
upstream chat         { server chat:4000; }
upstream notification { server notification:4000; }
# ip_hash keeps a client on one ws instance during Socket.IO's polling handshake.
upstream ws           { ip_hash; server ws:4000; }

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/auth/          { proxy_pass http://auth; }
  location /api/notifications  { proxy_pass http://notification; }
  location /api/               { proxy_pass http://chat; }

  location /socket.io/ {
    proxy_pass http://ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
